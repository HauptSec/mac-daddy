<svg width="520" height="260" viewBox="0 0 680 300" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>mac-daddy logo v2</title>
  <desc>Terminal window with a command key icon above the mac-daddy wordmark</desc>
  <style>
    .wc { fill: #0d1117; stroke: #30363d; stroke-width: 1 }
    .sep { stroke: #21262d; stroke-width: 1; fill: none }
    .wt { font-family: 'SF Mono','Cascadia Code','Fira Code',monospace; font-size: 36px; font-weight: 700; fill: #f0f6fc }
    .tg { font-family: system-ui,-apple-system,sans-serif; font-size: 12px; fill: #7d8590 }
    .pd { font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; fill: #3fb950 }
    .pc { font-family: 'SF Mono','Fira Code',monospace; font-size: 13px; fill: #c9d1d9 }
    .cu { fill: #3fb950; opacity: 0.9 }
    .br { fill: #161b22; stroke: #30363d; stroke-width: 1 }
    .cmd { font-family: system-ui,-apple-system,sans-serif; font-size: 74px; fill: #3fb950 }
  </style>

  <rect class="wc" x="80" y="20" width="520" height="260" rx="12"/>

  <circle cx="112" cy="50" r="6" fill="#ff5f57"/>
  <circle cx="133" cy="50" r="6" fill="#ffbd2e"/>
  <circle cx="154" cy="50" r="6" fill="#28c840"/>
  <text class="tg" x="340" y="54" text-anchor="middle">~/mac-daddy — zsh</text>

  <line class="sep" x1="80" y1="66" x2="600" y2="66"/>

  <text class="cmd" x="340" y="158" text-anchor="middle" dominant-baseline="middle">⌘</text>

  <text class="wt" x="340" y="207" text-anchor="middle">mac-daddy</text>

  <text class="tg" x="340" y="225" text-anchor="middle" font-size="13" fill="#6e7681" letter-spacing="1.5">AUTOMATED MACOS SETUP</text>

  <rect class="br" x="88" y="240" width="504" height="30" rx="6"/>
  <text class="pd" x="104" y="260">$</text>
  <text class="pc" x="120" y="260">./scripts/install.sh work --verbose</text>
  <rect class="cu" x="376" y="247" width="8" height="14"/>
</svg>
